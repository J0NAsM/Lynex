<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 533" role="img" aria-labelledby="title description">
  <title id="title">Lynex</title>
  <desc id="description">Nombre Lynex en acabado plateado sobre un fondo azul oscuro.</desc>
  <defs>
    <radialGradient id="background-glow" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#0a1a32"/>
      <stop offset="0.55" stop-color="#041126"/>
      <stop offset="1" stop-color="#010817"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#d7dde5"/>
      <stop offset="0.48" stop-color="#8995a5"/>
      <stop offset="0.66" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#98a3b2"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency="0.72" numOctaves="3" seed="17" type="fractalNoise"/>
