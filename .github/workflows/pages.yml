name: Publicar sitio web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_STATIC_HOSTING: "true"
      NEXT_PUBLIC_SITE_URL: https://j0nasm.github.io/Lynex
      NEXT_PUBLIC_CONTACT_EMAIL: martinezlynex@gmail.com
      NEXT_PUBLIC_WHATSAPP_NUMBER: "595986914726"
      NEXT_PUBLIC_CONTACT_PHONE: "+595 986 914 726"
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar versión estática
        run: mv src/app/api/contact/route.ts src/app/api/contact/route.ts.disabled
      - name: Construir sitio web
        run: npm run build
      - name: Verificar el índice publicado
        run: npm run verify:pages
      - name: Subir sitio generado
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
